# Example kerberoskeepalive config. Copy to ~/.config/kerberoskeepalive/config.yaml
# (or pass --config) and adjust for your environment.

# Optional: forwarded as KRB5_CONFIG to kinit if set. Leave blank to use
# kinit's default (/etc/krb5.conf).
krb5_conf_path: ""

daemon:
  # How often the daemon checks whether any profile needs refreshing.
  # Changing this requires restarting the daemon (`daemon uninstall` then
  # `daemon install` again); profiles/thresholds below can be edited live.
  poll_interval: 60s

  # The daemon's own log. Optional, shown here at its default. Like
  # poll_interval, a change needs a daemon restart.
  #
  # There are no rotation settings here: newsyslog owns rotation, via
  # /etc/newsyslog.d/kerberoskeepalive.conf. That matters because an
  # unreachable KDC (VPN down, laptop off the corporate network) logs two
  # lines per poll for as long as it lasts. The daemon's only job is to
  # notice when newsyslog has renamed the file, and reopen.
  log:
    path: ~/Library/Logs/kerberoskeepalive.log

profiles:
  - name: corp
    principal: jdoe@CORP.EXAMPLE.COM
    keychain:
      # Must already exist in your login keychain, e.g. created via:
      #   security add-generic-password -a jdoe -s KerberosKeepAlive-corp -w
      service: KerberosKeepAlive-corp
      account: jdoe

    # Where the credential cache goes. Two forms:
    #
    #   API                  the default GSSCred cache — in memory, owned by
    #                        Apple's GSSCred daemon, never written to disk.
    #                        Recommended: nothing survives logout or reboot,
    #                        nothing lands in Time Machine, and GSS-API
    #                        consumers (Alpaca, curl --negotiate, Chrome)
    #                        resolve it as the default credential with no
    #                        KRB5CCNAME plumbing.
    #
    #   /absolute/path       a FILE: cache, or write it as FILE:/absolute/path.
    #                        Use only if something needs a real file. A FILE
    #                        ccache is a bearer credential at rest: anyone who
    #                        copies it can authenticate as you until it
    #                        expires, and it cannot be revoked.
    #
    # Note there is no API:name form. macOS keys API caches by UUID, so only
    # the default one can be targeted — which also means exactly one profile
    # may use "API".
    ccache: API

    # Requested ticket lifetime, passed to kinit as --lifetime. Optional;
    # omit to take the realm's default (commonly 10h). The KDC issues
    # min(requested, account policy), so asking for less always works and
    # asking for more silently does not.
    #
    # This is the ceiling on how long a leaked ticket stays usable. Tickets
    # are acquired non-renewable on purpose — the daemon re-acquires from the
    # Keychain password rather than renewing — so nothing can extend it.
    ticket_lifetime: 3h

    # Re-acquire once this much validity remains. Must be meaningfully below
    # ticket_lifetime: the daemon refreshes every (lifetime - threshold), so
    # 3h/30m re-acquires roughly every 2h30m. Setting it at or above the
    # lifetime is rejected, because a freshly issued ticket would already
    # read as due and every poll would fire a new AS-REQ.
    refresh_threshold: 30m

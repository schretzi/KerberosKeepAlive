# Example kerberoskeepalive config. Copy to ~/.config/kerberoskeepalive/config.yaml
# (or pass --config) and adjust for your environment.

# Optional: forwarded as KRB5_CONFIG to kinit if set. Leave blank to use
# kinit's default (/etc/krb5.conf).
krb5_conf_path: ""

daemon:
  # How often the daemon checks whether any profile needs refreshing.
  # Changing this requires restarting the daemon (`daemon uninstall` then
  # `daemon install` again); profiles/thresholds below can be edited live.
  poll_interval: 60s

  # The daemon's own rotating log. Every value below is optional and shown
  # here at its default. Like poll_interval, changes need a daemon restart.
  #
  # Rotation matters because an unreachable KDC (VPN down, laptop off the
  # corporate network) logs two lines per poll for as long as it lasts.
  log:
    path: ~/Library/Logs/KerberosKeepAlive/daemon.log
    # Rotate once the active file reaches this size.
    max_size_mb: 5
    # Keep at most this many rotated files (0 = keep all).
    max_backups: 3
    # Delete rotated files older than this many days (0 = never by age).
    max_age_days: 28
    # gzip rotated files.
    compress: true

profiles:
  - name: corp
    principal: jdoe@CORP.EXAMPLE.COM
    keychain:
      # Must already exist in your login keychain, e.g. created via:
      #   security add-generic-password -a jdoe -s KerberosKeepAlive-corp -w
      service: KerberosKeepAlive-corp
      account: jdoe
    ccache_path: /Users/jdoe/.krb5cc/corp
    refresh_threshold: 30m

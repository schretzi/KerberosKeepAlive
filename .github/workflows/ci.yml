name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# This project is macOS-only (LaunchAgent, Keychain, kinit) and links cgo
# (github.com/keybase/go-keychain uses CoreFoundation/Security), so every
# job runs on macos-latest — it cannot build or run on Linux/Windows.

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -cover

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  security:
    name: Security
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: govulncheck ./...
      - run: gosec -quiet ./...

  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o kerberoskeepalive .
